<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6BFF"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#00D68F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo rounded -->
  <rect width="64" height="64" rx="14" fill="#0D1B2A"/>

  <!-- Hexágono externo -->
  <polygon
    points="32,6 54,19 54,45 32,58 10,45 10,19"
    fill="url(#hexGrad)"
    opacity="0.18"
    stroke="url(#hexGrad)"
    stroke-width="1.5"
  />

  <!-- Hexágono médio -->
  <polygon
    points="32,14 46,22 46,38 32,46 18,38 18,22"
    fill="none"
    stroke="url(#hexGrad)"
    stroke-width="1"
    opacity="0.45"
  />

  <!-- Setas de extração convergindo ao centro -->
  <line x1="18" y1="20" x2="32" y2="32" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="32,32 24,28 27,37" fill="#00C8FF"/>

  <line x1="46" y1="44" x2="32" y2="32" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="32,32 40,36 37,27" fill="#00D68F"/>

  <!-- Ponto central -->
  <circle cx="32" cy="32" r="5" fill="url(#hexGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>
</svg>
