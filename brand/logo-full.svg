<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6BFF"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#00D68F"/>
    </linearGradient>
  </defs>

  <!-- Hexágono base -->
  <polygon
    points="36,4 60,18 60,46 36,60 12,46 12,18"
    fill="url(#hexGrad)"
    opacity="0.15"
    stroke="url(#hexGrad)"
    stroke-width="1.5"
  />

  <!-- Hexágono interno menor -->
  <polygon
    points="36,14 52,23 52,41 36,50 20,41 20,23"
    fill="none"
    stroke="url(#hexGrad)"
    stroke-width="1"
    opacity="0.4"
  />

  <!-- Seta de extração — diagonal superior esquerda entrando -->
  <path
    d="M20 20 L36 32"
    stroke="url(#arrowGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <polygon points="36,32 28,29 31,38" fill="url(#arrowGrad)"/>

  <!-- Seta de extração — diagonal inferior direita entrando -->
  <path
    d="M52 44 L36 32"
    stroke="url(#arrowGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <polygon points="36,32 44,35 41,26" fill="url(#arrowGrad)"/>

  <!-- Ponto central — "core" extraído -->
  <circle cx="36" cy="32" r="4" fill="url(#hexGrad)"/>
  <circle cx="36" cy="32" r="2" fill="#FFFFFF"/>

  <!-- Wordmark: Core -->
  <text
    x="78"
    y="38"
    font-family="'Inter', 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="26"
    fill="#0D1B2A"
    letter-spacing="-0.5"
  >Core</text>

  <!-- Wordmark: Extract (em azul) -->
  <text
    x="149"
    y="38"
    font-family="'Inter', 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="26"
    fill="url(#hexGrad)"
    letter-spacing="-0.5"
  >Extract</text>

  <!-- Tagline -->
  <text
    x="78"
    y="54"
    font-family="'Inter', 'Segoe UI', sans-serif"
    font-weight="400"
    font-size="10"
    fill="#6B7A99"
    letter-spacing="0.8"
  >INTELIGÊNCIA EM CADA CURRÍCULO</text>
</svg>
