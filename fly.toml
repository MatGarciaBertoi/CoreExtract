# fly.toml app configuration file generated for btextract-bertoi on 2026-05-05T18:48:13-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'btextract-bertoi'
primary_region = 'gru'

[build]

[env]
  BT_DB_PATH = '/data/btextract.db'

[[mounts]]
  source = 'btextract_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
